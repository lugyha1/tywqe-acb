[project]
name = "telegram-premium-bot"
version = "0.1.0"
description = "Production-ready aiogram bot rebuilt with Clean Architecture."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.28.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "redis>=5.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "structlog>=24.1.0",
  "orjson>=3.10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "black>=24.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]

[project.scripts]
bot = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "N", "S", "C4", "PIE", "RET", "SIM"]
ignore = ["S101"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
