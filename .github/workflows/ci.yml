name: CI
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy src
      - run: uv run pytest
